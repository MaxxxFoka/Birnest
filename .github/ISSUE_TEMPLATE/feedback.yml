name: Feedback or idea
description: Balance, a bird that feels off, a feature you want, or anything else.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: input
    id: version
    attributes:
      label: Beta version
      placeholder: v0.1.0-beta.1
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What would make Birnest more fun?
    validations:
      required: true
