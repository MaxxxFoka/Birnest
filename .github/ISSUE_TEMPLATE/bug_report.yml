name: Bug report
description: Something is broken, crashes or looks wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping test Birnest! Please don't include personal information.
  - type: input
    id: version
    attributes:
      label: Beta version
      description: The release you downloaded, e.g. v0.1.0-beta.1
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where did it happen?
      options:
        - Main menu or settings
        - Practice match
        - Online lobby
        - Online match
        - Watching a replay or a live match
        - Installing or launching the game
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Practice on Canopy as Thornback
        2. Fly over the river and press R
        3. ...
  - type: textarea
    id: media
    attributes:
      label: Screenshots, video, replay or console output
      description: Drag files in here. Replays are in %APPDATA%\Godot\app_userdata\ (zip the .bndreplay file).
  - type: input
    id: pc
    attributes:
      label: Your PC
      description: Windows version and graphics card
      placeholder: Windows 11, RTX 3060
